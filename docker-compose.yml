version: "3.8"

services:
  db:
    image: mariadb:11.4
    networks:
      - backend
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/root_pwd
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD_FILE: /run/secrets/wp_pwd
    secrets:
      - root_pwd
      - wp_pwd
    deploy:
      placement:
        constraints:
          - node.role == manager

  wordpress:
    image: wordpress:6.8.2-fpm-alpine
    networks:
      - backend
      - frontend
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/wp_pwd
      WORDPRESS_DB_NAME: wordpress
    secrets:
      - wp_pwd
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:1.28.0-alpine3.21
    ports:
      - "80:80"
    networks:
      - frontend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wp_data:/var/www/html
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

networks:
  frontend:
    driver: overlay
  backend:
    driver: overlay

volumes:
  db_data:
  wp_data:

secrets:
  root_pwd:
    external: true
  wp_pwd:
    external: true
